services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      - --model=/models/${LLAMACPP_MODEL:-model.gguf}
      - --host=0.0.0.0
      - --port=8080
      - --n-gpu-layers=999
      - --ctx-size=${LLAMACPP_CTX_SIZE:-8192}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
