# Base image is CPU-only. Pair with docker-compose.gpu.yml on CUDA hosts
# (the Makefile does this automatically when nvidia runtime is detected).
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llamacpp
    restart: unless-stopped
    command:
      - --model=/models/${LLAMACPP_MODEL:-model.gguf}
      - --host=0.0.0.0
      - --port=8080
      - --ctx-size=${LLAMACPP_CTX_SIZE:-8192}
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
