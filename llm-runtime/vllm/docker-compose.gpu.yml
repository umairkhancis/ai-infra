services:
  vllm:
    command:
      - --model=${VLLM_MODEL:-meta-llama/Llama-3.2-3B-Instruct}
      - --served-model-name=${VLLM_SERVED_MODEL_NAME:-llama3.2}
      - --host=0.0.0.0
      - --port=8000
      - --dtype=auto
      - --gpu-memory-utilization=0.90
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
