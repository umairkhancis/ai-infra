# Base config runs CPU-only (usable on Mac for gateway plumbing tests).
# For real inference always pair with docker-compose.gpu.yml on a CUDA host.
#
# VLLM_MODEL: HuggingFace model ID to load
# VLLM_SERVED_MODEL_NAME: name LiteLLM uses to call this runtime (must match config.yaml)
services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    ipc: host
    command:
      - --model=${VLLM_MODEL:-meta-llama/Llama-3.2-3B-Instruct}
      - --served-model-name=${VLLM_SERVED_MODEL_NAME:-llama3.2}
      - --host=0.0.0.0
      - --port=8000
      - --device=cpu
      - --dtype=float32
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"

volumes:
  hf_cache:
