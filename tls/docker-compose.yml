services:
  bootstrap:
    image: alpine:3.20
    container_name: tls-bootstrap
    command:
      - sh
      - -ec
      - |
        if [ -f /certs/gateway.pem ] && [ -f /certs/gateway-key.pem ] && [ -f /certs/cacert.pem ]; then
          echo "infra-certs volume already populated — nothing to do."
          echo "To re-seed: docker volume rm infra-certs && docker volume create infra-certs && docker compose up"
          ls -la /certs
          exit 0
        fi
        cp /seed/cacert.pem /seed/gateway.pem /seed/gateway-key.pem /certs/
        [ -f /seed/rootCA.pem ] && cp /seed/rootCA.pem /certs/ || true
        chmod 644 /certs/cacert.pem /certs/gateway.pem
        [ -f /certs/rootCA.pem ] && chmod 644 /certs/rootCA.pem
        chmod 600 /certs/gateway-key.pem
        echo "Seeded infra-certs volume:"
        ls -la /certs
    volumes:
      - ./local:/seed:ro
      - infra-certs:/certs

volumes:
  infra-certs:
    external: true
